flutter_launcher_icons:
  image_path: "assets/images/app_iconA.png"   # full icon, 1024x1024, cream background
  android: true
  ios: true
  remove_alpha_ios: true                     # Apple rejects icons with transparency
  min_sdk_android: 21

  # Android adaptive icon: lets Android crop it into a circle / squircle
  # (home screen AND the Android 12+ launch screen).
  adaptive_icon_background: "#F0F0C8"        # cream
  adaptive_icon_foreground: "assets/images/app_icon_foregroundC.png"  # card only, transparent bg